<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="A phone showing a five-star review and a call button">
  <rect width="480" height="360" fill="#eaf6ff"/>
  <rect y="286" width="480" height="74" fill="#d7ebfb"/>
  <!-- phone -->
  <rect x="165" y="34" width="150" height="270" rx="22" fill="#ffffff" stroke="#0b6bb5" stroke-width="4"/>
  <rect x="177" y="52" width="126" height="234" rx="12" fill="#f5fbff"/>
  <rect x="220" y="42" width="40" height="5" rx="2.5" fill="#9ed2f7"/>
  <!-- the review card -->
  <rect x="189" y="70" width="102" height="96" rx="8" fill="#ffffff" stroke="#9ed2f7" stroke-width="3"/>
  <circle cx="206" cy="88" r="9" fill="#65bdf5"/>
  <rect x="220" y="82" width="54" height="6" rx="3" fill="#9ed2f7"/>
  <rect x="220" y="92" width="36" height="5" rx="2.5" fill="#d7ebfb"/>
  <!-- five stars -->
  <g fill="#f0b429">
    <path id="star" d="M0-7 L2.1-2.2 L7-1.6 L3.4 1.8 L4.3 6.6 L0 4.2 L-4.3 6.6 L-3.4 1.8 L-7-1.6 L-2.1-2.2 Z" transform="translate(203 116)"/>
    <use href="#star" x="18"/><use href="#star" x="36"/><use href="#star" x="54"/><use href="#star" x="72"/>
  </g>
  <rect x="199" y="134" width="82" height="5" rx="2.5" fill="#d7ebfb"/>
  <rect x="199" y="144" width="66" height="5" rx="2.5" fill="#d7ebfb"/>
  <rect x="199" y="154" width="74" height="5" rx="2.5" fill="#d7ebfb"/>
  <!-- a second card -->
  <rect x="189" y="178" width="102" height="52" rx="8" fill="#ffffff" stroke="#9ed2f7" stroke-width="3"/>
  <rect x="199" y="190" width="70" height="6" rx="3" fill="#9ed2f7"/>
  <rect x="199" y="203" width="82" height="5" rx="2.5" fill="#d7ebfb"/>
  <rect x="199" y="213" width="58" height="5" rx="2.5" fill="#d7ebfb"/>
  <!-- the call button -->
  <rect x="189" y="244" width="102" height="30" rx="15" fill="#2f9e44"/>
  <path d="M212 252 c3 -2 5 -1 6 2 l2 4 c1 2 0 3 -1 4 c2 4 5 7 9 9 c1 -1 2 -2 4 -1 l4 2 c3 1 4 3 2 6 c-2 3 -5 4 -9 3 c-9 -3 -18 -12 -21 -21 c-1 -4 0 -7 4 -8 z" fill="#ffffff"/>
  <rect x="234" y="255" width="44" height="8" rx="4" fill="#ffffff"/>
  <!-- a reply bubble with a check -->
  <path d="M330 96 h96 a12 12 0 0 1 12 12 v56 a12 12 0 0 1 -12 12 h-60 l-22 20 v-20 h-14 a12 12 0 0 1 -12 -12 v-56 a12 12 0 0 1 12 -12 z" fill="#ffffff" stroke="#0b6bb5" stroke-width="4"/>
  <polyline points="352 138 372 158 410 118" fill="none" stroke="#2f9e44" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the notification dot -->
  <circle cx="312" cy="44" r="12" fill="#f0b429" stroke="#ffffff" stroke-width="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="A notepad and pen with a project plan sketched out">
  <rect width="480" height="360" fill="#eaf6ff"/>
  <!-- desk surface -->
  <rect y="268" width="480" height="92" fill="#d7ebfb"/>
  <!-- coffee cup -->
  <g>
    <rect x="372" y="212" width="52" height="56" rx="8" fill="#ffffff" stroke="#0b6bb5" stroke-width="3"/>
    <path d="M424 226 h14 a12 12 0 0 1 0 24 h-14" fill="none" stroke="#0b6bb5" stroke-width="3"/>
    <path d="M384 200 c0 -10 10 -10 10 -20 M402 200 c0 -10 10 -10 10 -20" fill="none" stroke="#9ec9e8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- notepad -->
  <g>
    <rect x="62" y="64" width="250" height="248" rx="10" fill="#ffffff" stroke="#0b6bb5" stroke-width="3"/>
    <!-- spiral binding -->
    <g stroke="#f0b429" stroke-width="5" stroke-linecap="round">
      <line x1="92" y1="52" x2="92" y2="80"/>
      <line x1="132" y1="52" x2="132" y2="80"/>
      <line x1="172" y1="52" x2="172" y2="80"/>
      <line x1="212" y1="52" x2="212" y2="80"/>
      <line x1="252" y1="52" x2="252" y2="80"/>
    </g>
    <!-- checklist -->
    <g>
      <rect x="90" y="112" width="18" height="18" rx="4" fill="none" stroke="#2f9e44" stroke-width="3"/>
      <polyline points="94 121 100 127 112 111" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="122" y="117" width="150" height="8" rx="4" fill="#cfe6f7"/>
    </g>
    <g>
      <rect x="90" y="156" width="18" height="18" rx="4" fill="none" stroke="#2f9e44" stroke-width="3"/>
      <polyline points="94 165 100 171 112 155" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="122" y="161" width="120" height="8" rx="4" fill="#cfe6f7"/>
    </g>
    <g>
      <rect x="90" y="200" width="18" height="18" rx="4" fill="none" stroke="#9ec9e8" stroke-width="3"/>
      <rect x="122" y="205" width="140" height="8" rx="4" fill="#e2eef7"/>
    </g>
    <g>
      <rect x="90" y="244" width="18" height="18" rx="4" fill="none" stroke="#9ec9e8" stroke-width="3"/>
      <rect x="122" y="249" width="100" height="8" rx="4" fill="#e2eef7"/>
    </g>
  </g>
  <!-- pen -->
  <g transform="rotate(24 360 150)">
    <rect x="336" y="96" width="20" height="118" rx="6" fill="#149dff"/>
    <rect x="336" y="80" width="20" height="20" fill="#0b6bb5"/>
    <path d="M336 214 h20 l-10 22 z" fill="#1f1e1d"/>
  </g>
</svg>

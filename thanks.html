<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You &mdash; Pegasus Labs</title>
    <!-- form-success page: the conversion URL for ads and analytics.
         People land here only by submitting the form - noindex keeps
         search engines from offering it as a front door. -->
    <meta name="robots" content="noindex" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .thanks-card {
        max-width: 560px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .thanks-mark {
        width: clamp(110px, 22vw, 160px);
        height: auto;
        color: #149dff; /* --primary-color */
      }
      h1 {
        color: #149dff;
        font-weight: 700;
        font-size: clamp(1.5rem, 3.5vw, 2.2rem);
        line-height: 1.3;
      }
      a {
        display: inline-block;
        background: #ffffff;
        color: #149dff;
        border: 2px solid #149dff;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        padding: 14px 34px;
        border-radius: 999px;
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          translate 0.25s ease;
      }
      a:hover,
      a:focus-visible {
        background: #149dff;
        color: #ffffff;
        translate: 0 -2px;
      }
    </style>
  </head>
